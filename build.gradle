plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.assignment'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

bootJar {
	archiveFileName = 'app.jar'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.postgresql:postgresql:42.7.9'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.0.2'
	implementation 'org.springframework.boot:spring-boot-starter-web:4.0.2'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
	implementation 'org.springframework.boot:spring-boot-starter-security:4.0.2'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:4.0.2'
	implementation 'org.apache.commons:commons-lang3:3.20.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch:4.0.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
